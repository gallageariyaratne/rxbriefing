<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Healthcare companies — pipelines, filings and news | RxBriefing</title>
<meta name="description" content="Every pharma, biotech, medtech, payer, health IT and health AI company tracked by RxBriefing, with pipeline, SEC filings and news pages.">
<style>
  :root { --paper:#FAF9F6; --paper2:#F1EFE9; --ink:#141414; --ink2:#3A3A38; --mute:#6B6B66; --rule:#D9D6CF; --rule2:#EAE7E0; --red:#B42318; --green:#137A3A; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); }
  :root[data-theme="dark"] { --paper:#121212; --paper2:#1B1B1B; --ink:#EDEBE6; --ink2:#CFCCC4; --mute:#9A978F; --rule:#2E2E2C; --rule2:#232321; --red:#E5604F; --green:#4CC77A; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; } a:hover { text-decoration:underline; text-underline-offset:2px; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 18px; }
  .bar { display:flex; align-items:center; justify-content:space-between; padding:12px 0 10px; border-bottom:2px solid var(--ink); }
  .brand { display:flex; align-items:center; gap:10px; font-family:Arial,Helvetica,sans-serif; font-weight:700; font-size:22px; }
  .brand .mark { width:30px; height:30px; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-size:15px; letter-spacing:-.03em; }
  .bar nav { display:flex; gap:18px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .bar nav a.cur { box-shadow:inset 0 -3px 0 var(--red); padding-bottom:4px; }
  h1 { font-family:Arial,Helvetica,sans-serif; font-weight:700; font-size:clamp(28px,4.5vw,40px); letter-spacing:-.015em; line-height:1.1; margin:22px 0 6px; }
  .kicker { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--red); margin-top:18px; }
  .mono { font-family:Arial,Helvetica,sans-serif; }
  .mute { color:var(--mute); } .up { color:var(--green); } .down { color:var(--red); }
  section { border-top:2px solid var(--ink); padding:10px 0 18px; margin:22px 0 0; }
  h2 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; margin:0 0 12px; font-weight:700; }
  ul.list { list-style:none; margin:0; padding:0; } ul.list li { display:flex; gap:12px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--rule2); font-size:14px; flex-wrap:wrap; }
  .form { font-family:Arial,Helvetica,sans-serif; font-size:11px; font-weight:500; border:1px solid var(--rule); background:var(--paper2); padding:1px 6px; min-width:64px; text-align:center; }
  .date { font-family:Arial,Helvetica,sans-serif; color:var(--mute); font-size:12px; min-width:86px; }
  .note { font-size:12px; color:var(--mute); margin-top:10px; }
  footer { border-top:1px solid var(--rule); color:var(--mute); font-size:12px; padding:16px 0 30px; margin-top:26px; } footer a { text-decoration:underline; }

  input { width:100%; margin:14px 0; border:1px solid var(--rule); background:var(--paper); color:var(--ink); padding:9px 10px; font:inherit; font-size:14px; border-radius:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:0 24px; }
  .card { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:7px 0; border-bottom:1px solid var(--rule2); }
  .card b { font-family:Arial,Helvetica,sans-serif; font-weight:500; font-size:13px; margin-right:8px; } .card span.nm { font-size:14px; }
  .chg { font-family:Arial,Helvetica,sans-serif; font-size:12px; }
</style>
</head>
<body>
<div class="wrap"><div class="bar"><a class="brand" href="/"><span class="mark">Rx</span>RxBriefing</a><nav><a href="/">News</a><a href="/companies/" class="cur">Companies</a><a href="/pipeline/">Pipeline 101</a></nav></div></div><div class="wrap"><h1>All companies</h1>
<main>
  <input id="q" type="search" placeholder="Filter by name or ticker" aria-label="Filter companies">
  <div id="out"></div>
  <footer><a href="/">← News</a> · <a href="/pipeline/">How a drug gets made</a></footer>
</div></main>
<script>
try{if(localStorage.getItem("rxb-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}
(async()=>{
  const d=await (await fetch("/data/news.json",{cache:"no-store"})).json();
  const list=Object.entries(d.tickers).filter(([,v])=>v.sector!=="etf").map(([t,v])=>({t,...v})).sort((a,b)=>a.name.localeCompare(b.name));
  const render=(q="")=>{const g={};list.filter(x=>!q||(x.name+" "+x.t).toLowerCase().includes(q)).forEach(x=>(g[x.sector]=g[x.sector]||[]).push(x));
    document.getElementById("out").innerHTML=Object.keys(g).map(s=>`<h2>${d.sector_labels[s]||s}</h2><div class="grid">${g[s].map(x=>{const p=d.quotes[x.t];const c=p?(p.change_pct>0?"up":p.change_pct<0?"down":""):"";
      return `<a class="card" href="/company/${x.t}/"><span class="nm"><b>${x.t}</b>${x.name}</span>${p?`<span class="chg ${c}">${p.change_pct>0?"+":""}${p.change_pct.toFixed(2)}%</span>`:""}</a>`}).join("")}</div>`).join("");};
  render(); document.getElementById("q").oninput=e=>render(e.target.value.trim().toLowerCase());
})();
</script>
</body></html>
